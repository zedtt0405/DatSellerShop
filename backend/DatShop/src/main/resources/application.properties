spring.application.name=DatShop

# Optional local overrides (file is gitignored): ./application-local.properties next to pom.xml
spring.config.import=optional:file:./application-local.properties

# MySQL 8 — override with environment variables (see .env.example)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_fashion_shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate (local development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# One SQL log line per statement. show-sql is off so Hibernate does not print a second copy.
logging.level.org.hibernate.SQL=DEBUG

# JWT — secret must be Base64 and decode to at least 32 bytes. Do not commit the secret.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS for the future Vite dev server. Comma-separated origins. Never use "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Jackson 3: reject request JSON fields that are not part of the DTO.
spring.jackson.deserialization.fail-on-unknown-properties=true
