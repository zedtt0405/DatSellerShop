# Test classpath only. This file is not packaged into the application JAR.
# It supplies the keys a full replacement of application.properties must keep,
# while forcing the regression database and schema validation.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/smart_fashion_shop_regression_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Kept from the main config. The test file replaces that document for Surefire.
spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.org.hibernate.SQL=WARN
